steps:
  # ==============================================================
  # Ubuntu 22.04 amd64 Build (Dockerfile.ubuntu2204)
  # ==============================================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--target'
      - 'appbuilder'
      - '--build-arg'
      - 'TARGETARCH=amd64'
      - '-t'
      - 'builder:ubuntu-amd64'
      - '-f'
      - 'Dockerfile.ubuntu2204'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        mkdir -p ./artifacts
        docker create --name extract-ubuntu builder:ubuntu-amd64
        docker cp extract-ubuntu:/app/main ./artifacts/fincent-api-ubuntu-22.04-amd64
        docker cp extract-ubuntu:/app/duckdblib ./artifacts/duckdblib-ubuntu
        docker rm extract-ubuntu
        chmod +x ./artifacts/fincent-api-ubuntu-22.04-amd64

  # ==============================================================
  # Package Ubuntu static libraries and clean up staging
  # ==============================================================
  - name: 'python:3.11-slim'
    entrypoint: 'python3'
    args:
      - '-c'
      - |
        import shutil, os
        print("Packaging Ubuntu static libraries...")
        shutil.make_archive('artifacts/duckdb-static-libs-ubuntu-22.04-amd64', 'zip', 'artifacts/duckdblib-ubuntu')
        shutil.rmtree('artifacts/duckdblib-ubuntu')

        print("\nGenerated Ubuntu Artifacts:")
        for f in sorted(os.listdir('artifacts')):
            p = os.path.join('artifacts', f)
            print(f"  • {f} ({os.path.getsize(p) / 1024 / 1024:.2f} MB)")

# Upload artifacts to GCS
artifacts:
  objects:
    location: 'gs://kennyf/dukduk-artifacts'
    paths:
      - 'artifacts/*'

options:
  machineType: 'E2_HIGHCPU_32'
timeout: '3600s'
