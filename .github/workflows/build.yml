name: Build Multi-Platform Artifacts

on:
  push:
    branches: [main, master, feat/*]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux-cloud:
    name: Build Linux (SUSE & Ubuntu via Cloud Build 32-vCPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit Build to Google Cloud Build
        run: |
          gcloud builds submit \
            --project=kennyx-500614 \
            --config=cloudbuild.yaml \
            --machine-type=e2-highcpu-32 \
            .

      - name: Download Linux Artifacts from GCS
        run: |
          mkdir -p ./artifacts
          gcloud storage cp -r "gs://kennyf/dukduk-artifacts/*" ./artifacts/
          if [ -d "./artifacts/artifacts" ]; then
            mv ./artifacts/artifacts/* ./artifacts/ 2>/dev/null || true
            rm -rf ./artifacts/artifacts
          fi
          if [ -d "./artifacts/linux-amd64" ]; then
            mv ./artifacts/linux-amd64/* ./artifacts/ 2>/dev/null || true
            rm -rf ./artifacts/linux-amd64
          fi
          rm -f ./artifacts/*.json 2>/dev/null || true
          chmod +x ./artifacts/fincent-api-* 2>/dev/null || true
          ls -lh ./artifacts/

      - name: Upload SUSE Linux amd64 Binary
        uses: actions/upload-artifact@v4
        with:
          name: fincent-api-linux-amd64
          path: ./artifacts/fincent-api-linux-amd64

      - name: Upload SUSE Linux amd64 Static Libraries
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-static-libs-linux-amd64
          path: ./artifacts/duckdb-static-libs-linux-amd64.zip

      - name: Upload Ubuntu amd64 Binary
        uses: actions/upload-artifact@v4
        with:
          name: fincent-api-ubuntu-22.04-amd64
          path: ./artifacts/fincent-api-ubuntu-22.04-amd64

      - name: Upload Ubuntu amd64 Static Libraries
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-static-libs-ubuntu-22.04-amd64
          path: ./artifacts/duckdb-static-libs-ubuntu-22.04-amd64.zip

  build-macos:
    name: Build macOS arm64 (Native Runner)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'

      - name: Install Dependencies
        run: |
          brew install cmake git python3

      - name: Build DuckDB and App (macOS arm64)
        run: |
          chmod +x scripts/build_multi_platform.sh
          ./scripts/build_multi_platform.sh macos-arm64

      - name: Upload macOS arm64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fincent-api-macos-arm64
          path: ./artifacts/fincent-api-macos-arm64

      - name: Upload macOS arm64 Static Libraries
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-static-libs-macos-arm64
          path: ./artifacts/duckdb-static-libs-macos-arm64.zip

  release:
    name: Publish GitHub Release
    needs: [build-linux-cloud, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            fincent-api-linux-amd64/fincent-api-linux-amd64
            fincent-api-ubuntu-22.04-amd64/fincent-api-ubuntu-22.04-amd64
            fincent-api-macos-arm64/fincent-api-macos-arm64
            duckdb-static-libs-linux-amd64/duckdb-static-libs-linux-amd64.zip
            duckdb-static-libs-ubuntu-22.04-amd64/duckdb-static-libs-ubuntu-22.04-amd64.zip
            duckdb-static-libs-macos-arm64/duckdb-static-libs-macos-arm64.zip
